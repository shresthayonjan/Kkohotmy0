<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yonjan Shrestha</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #d8d8d8;
      overflow: hidden;
    }

    /* DESKTOP VIEW */
    #desktopView {
      display: block;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #eeeeee, #cfcfcf);
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 190px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.35));
      pointer-events: none;
    }

    .scene {
      position: relative;
      width: 700px;
      height: 700px;
      perspective: 1400px;
      transform-style: preserve-3d;
    }

    .circle-track {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 430px;
      height: 250px;
      padding: 28px;
      color: #fff;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 35px 55px rgba(0, 0, 0, 0.28);
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .card-1,
    .card-5 {
      background: #ff3b25;
    }

    .card-2,
    .card-4 {
      background: #111;
    }

    .card-3,
    .card-6 {
      background: #f5f5f5;
      color: #111;
    }

    .card-1 {
      transform: translate(-50%, -50%) rotateX(0deg) translateZ(360px);
    }

    .card-2 {
      transform: translate(-50%, -50%) rotateX(60deg) translateZ(360px);
    }

    .card-3 {
      transform: translate(-50%, -50%) rotateX(120deg) translateZ(360px);
    }

    .card-4 {
      transform: translate(-50%, -50%) rotateX(180deg) translateZ(360px);
    }

    .card-5 {
      transform: translate(-50%, -50%) rotateX(240deg) translateZ(360px);
    }

    .card-6 {
      transform: translate(-50%, -50%) rotateX(300deg) translateZ(360px);
    }

    .card span {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .card h1 {
      margin-top: 60px;
      font-size: 68px;
      line-height: 1;
    }

    .card-1 h1 {
      position: absolute;
      bottom: 20px;
      right: 35px;
      font-size: 170px;
    }

    .card h2 {
      margin-top: 35px;
      font-size: 38px;
      line-height: 0.95;
    }

    .card h3 {
      margin-top: 25px;
      font-size: 48px;
    }

    .card p {
      margin-top: 25px;
      font-size: 15px;
      line-height: 1.4;
    }

    .line {
      margin-top: 25px;
      padding: 22px 0;
      font-size: 22px;
      font-weight: bold;
      border-top: 1px solid #ccc;
    }

    .bottom-text {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: 80%;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translateX(-50%);
    }

    .email-copy {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
    }

    .email-text,
    .deck-text {
      color: #fff;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .deck-text {
      font-size: 16px;
    }

    .btn-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #111;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .btn-pill:hover {
      background: #eee;
    }

    .btn-pill:focus-visible {
      outline: 2px solid #111;
      outline-offset: 4px;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 82px;
      z-index: 200;
      padding: 10px 20px;
      color: #fff;
      background: #111;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      border-radius: 100px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* PHONE VIEW */
    #mobileView {
      display: none;
      background: #000;
    }

    .scroll-section {
      /* Increase to 800vh / 800svh for a longer scroll. */
      height: 500vh;
      height: 500svh;
    }

    .video-container {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #scrollVideo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      background: #000;
    }

    @media (max-width: 767px) {
      html {
        background: #000;
      }

      body {
        background: #000;
        overflow-x: hidden;
        overflow-y: auto;
      }

      #desktopView {
        display: none;
      }

      #mobileView {
        display: block;
      }
    }
  </style>
</head>

<body>
  <!-- DESKTOP: ROTATING CARDS -->
  <main id="desktopView">
    <div id="toast" role="status" aria-live="polite"></div>

    <section class="hero">
      <div class="scene">
        <div class="circle-track" id="circleTrack">
          <div class="card card-1">
            <span>Yonjan Shrestha</span>
            <h1>29</h1>
          </div>

          <div class="card card-2">
            <span>PROCESS</span>
            <h2>DISCOVER<br>DIRECTION<br>DESIGN</h2>
          </div>

          <div class="card card-3">
            <span>OPPORTUNITY</span>
            <div class="line">GAP</div>
            <div class="line">SHIFT</div>
          </div>

          <div class="card card-4">
            <span>METRICS</span>
            <h3>2.1M</h3>
            <p>NEW YORK 33%<br>LOS ANGELES 22%<br>LONDON 7%</p>
          </div>

          <div class="card card-5">
            <h1>Kkohotmy0</h1>
          </div>

          <div class="card card-6">
            <span>DATA</span>
            <h3>00000</h3>
            <h3>00000</h3>
          </div>
        </div>
      </div>

      <div class="bottom-text">
        <div class="email-copy">
          <span class="email-text">info@yonjanshrestha.com.np</span>

          <button class="btn-pill" id="copyButton" type="button">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              aria-hidden="true"
            >
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
            Copy
          </button>
        </div>

        <span class="deck-text">Hello, World!</span>
      </div>
    </section>
  </main>

  <!-- PHONE: FULL-SCREEN SCROLL VIDEO -->
  <main id="mobileView">
    <section class="scroll-section" id="scrollSection">
      <div class="video-container" id="videoContainer">
        <!-- Source is assigned only when the phone view is active. -->
        <video
          id="scrollVideo"
          data-src="IMG_8650.mp4"
          preload="auto"
          muted
          playsinline
          disablepictureinpicture
          aria-label="Scroll-controlled video"
        ></video>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const phoneQuery = window.matchMedia("(max-width: 767px)");
      const desktopView = document.getElementById("desktopView");
      const circleTrack = document.getElementById("circleTrack");
      const cards = desktopView.querySelectorAll(".card");
      const video = document.getElementById("scrollVideo");
      const scrollSection = document.getElementById("scrollSection");
      const videoContainer = document.getElementById("videoContainer");

      let isPhone = phoneQuery.matches;

      /* EMAIL COPY */
      let toastTimer;

      async function copyEmail() {
        const email = "info@yonjanshrestha.com.np";
        let copied = false;

        try {
          await navigator.clipboard.writeText(email);
          copied = true;
        } catch {
          const fallback = document.createElement("textarea");
          const previousFocus = document.activeElement;

          fallback.value = email;
          fallback.setAttribute("readonly", "");
          fallback.style.position = "fixed";
          fallback.style.left = "-9999px";
          document.body.appendChild(fallback);

          try {
            fallback.select();
            fallback.setSelectionRange(0, email.length);
            copied = document.execCommand("copy");
          } catch {
            copied = false;
          } finally {
            fallback.remove();
            previousFocus?.focus();
          }
        }

        const toast = document.getElementById("toast");
        toast.textContent = copied
          ? "Copied to clipboard ✓"
          : "Copy failed. Please copy the email manually.";

        clearTimeout(toastTimer);
        toast.classList.add("show");
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      }

      document.getElementById("copyButton")
        .addEventListener("click", copyEmail);

      /* DESKTOP CARD ANIMATION */
      let rotation = 0;
      let velocity = 0;
      let hovering = false;
      let lastWheelTime = -Infinity;
      let desktopFrame = 0;
      let previousTime = 0;

      function animateDesktop(time) {
        desktopFrame = 0;
        if (isPhone || document.hidden) return;

        const step = previousTime
          ? Math.min((time - previousTime) / (1000 / 60), 3)
          : 1;

        previousTime = time;

        if (!hovering && time - lastWheelTime > 180) {
          rotation += 0.30 * step;
        }

        rotation += velocity * step;
        velocity *= Math.pow(0.92, step);

        circleTrack.style.transform =
          `rotateX(${rotation % 360}deg) rotateZ(-8deg)`;

        desktopFrame = requestAnimationFrame(animateDesktop);
      }

      function stopDesktop() {
        cancelAnimationFrame(desktopFrame);
        desktopFrame = 0;
        previousTime = 0;
      }

      function startDesktop() {
        if (!desktopFrame && !isPhone && !document.hidden) {
          previousTime = 0;
          desktopFrame = requestAnimationFrame(animateDesktop);
        }
      }

      window.addEventListener("wheel", (event) => {
        // Allow native scrolling and browser zoom on phones.
        if (isPhone || event.ctrlKey) return;

        event.preventDefault();

        const delta = event.deltaMode === 1
          ? event.deltaY * 16
          : event.deltaMode === 2
            ? event.deltaY * window.innerHeight
            : event.deltaY;

        velocity += delta * 0.035;
        lastWheelTime = performance.now();
      }, { passive: false });

      cards.forEach((card) => {
        card.addEventListener("mouseenter", () => {
          if (isPhone) return;
          hovering = true;
          velocity = 0;
        });

        card.addEventListener("mouseleave", () => {
          hovering = false;
        });
      });

      /* PHONE VIDEO SCRUBBING */
      let videoFrame = 0;
      let targetTime = 0;

      video.muted = true;
      video.defaultMuted = true;

      function seekVideo() {
        if (
          !isPhone ||
          document.hidden ||
          video.readyState < 2 ||
          video.seeking ||
          !Number.isFinite(video.duration) ||
          video.duration <= 0
        ) {
          return;
        }

        // Finish the current seek before seeking to the newest scroll position.
        if (Math.abs(video.currentTime - targetTime) > 0.015) {
          video.currentTime = targetTime;
        }
      }

      function updateVideo() {
        videoFrame = 0;

        if (
          !isPhone ||
          !Number.isFinite(video.duration) ||
          video.duration <= 0
        ) {
          return;
        }

        const distance = Math.max(
          1,
          scrollSection.offsetHeight - videoContainer.offsetHeight
        );

        const progress = Math.min(
          1,
          Math.max(
            0,
            -scrollSection.getBoundingClientRect().top / distance
          )
        );

        // Stop slightly before the exact duration to retain the last frame.
        targetTime = progress * Math.max(0, video.duration - 0.04);
        seekVideo();
      }

      function scheduleVideoUpdate() {
        if (!isPhone || videoFrame) return;
        videoFrame = requestAnimationFrame(updateVideo);
      }

      video.addEventListener("loadedmetadata", scheduleVideoUpdate);
      video.addEventListener("loadeddata", scheduleVideoUpdate);
      video.addEventListener("canplay", scheduleVideoUpdate);
      video.addEventListener("seeked", seekVideo);

      // The video stays paused; scrolling changes its currentTime.
      video.addEventListener("play", () => video.pause());

      window.addEventListener("scroll", scheduleVideoUpdate, {
        passive: true
      });

      window.addEventListener("resize", scheduleVideoUpdate, {
        passive: true
      });

      /* SWITCH BETWEEN DESKTOP AND PHONE */
      function applyView() {
        isPhone = phoneQuery.matches;

        stopDesktop();
        cancelAnimationFrame(videoFrame);
        videoFrame = 0;
        velocity = 0;
        hovering = false;
        targetTime = 0;

        window.scrollTo(0, 0);

        if (isPhone) {
          if (!video.hasAttribute("src")) {
            video.src = video.dataset.src;
            video.load();
          }

          scheduleVideoUpdate();
        } else {
          video.pause();

          // Release the phone video when switching to desktop.
          if (video.hasAttribute("src")) {
            video.removeAttribute("src");
            video.load();
          }

          startDesktop();
        }
      }

      phoneQuery.addEventListener("change", applyView);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopDesktop();
          video.pause();
        } else if (isPhone) {
          scheduleVideoUpdate();
        } else {
          startDesktop();
        }
      });

      applyView();
    })();
  </script>
</body>
</html>
